<?php

session_start();

// Membuat angka rahasia
if (!isset($_SESSION['angka_rahasia'])) {
    $_SESSION['angka_rahasia'] = rand(1, 5);
    $_SESSION['percobaan'] = 0;
    $_SESSION['pesan'] = "";
}

// Jika tombol Tebak ditekan
if (isset($_POST['tebak'])) {

    if ($_SESSION['percobaan'] < 3) {

        $_SESSION['percobaan']++;

        $tebakan = $_POST['angka'];

        // Mengecek tebakan
        if ($tebakan == $_SESSION['angka_rahasia']) {
            $_SESSION['pesan'] = "Tebakan benar!";
        } else {
            $_SESSION['pesan'] = "Tebakan salah!";
        }
    }
}

// Jika tombol Main Lagi ditekan
if (isset($_POST['ulang'])) {

    $_SESSION['angka_rahasia'] = rand(1, 5);
    $_SESSION['percobaan'] = 0;
    $_SESSION['pesan'] = "";
}

?>

<!DOCTYPE html>
<html>
<head>
    <title>Game Tebak Angka</title>
</head>

<body>

    <h2>Game Tebak Angka</h2>

    <p>Silakan tebak angka dari <b>1 sampai 5</b></p>

    <p>
        Kesempatan:
        <b><?php echo $_SESSION['percobaan']; ?> / 3</b>
    </p>

    <?php if ($_SESSION['pesan'] != "") { ?>

        <p>
            <b><?php echo $_SESSION['pesan']; ?></b>
        </p>

    <?php } ?>

    <?php if ($_SESSION['percobaan'] < 3 && $_SESSION['pesan'] != "Tebakan benar!") { ?>

        <form method="post">

            <input
                type="number"
                name="angka"
                min="1"
                max="5"
                required
            >

            <button type="submit" name="tebak">
                Tebak
            </button>

        </form>

    <?php } else { ?>

        <?php if ($_SESSION['pesan'] != "Tebakan benar!") { ?>

            <p>
                <b>Kesempatan kamu sudah habis!</b>
            </p>

            <p>
                Angka yang benar adalah:
                <b><?php echo $_SESSION['angka_rahasia']; ?></b>
            </p>

        <?php } ?>

        <form method="post">
            <button type="submit" name="ulang">
                Main Lagi
            </button>
        </form>

    <?php } ?>

</body>
</html>
